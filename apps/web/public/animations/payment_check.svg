<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @keyframes checkStroke {
        0% { stroke-dashoffset: 48; opacity: 0; }
        30% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes circlePop {
        0% { transform: scale(0.7); opacity: 0; }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); opacity: 1; }
      }
      .circle-bg {
        animation: circlePop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transform-origin: center;
      }
      .check-mark {
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: checkStroke 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
      }
    </style>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="60" cy="60" r="48" fill="#DCFCE7" fill-opacity="0.5" />
  
  <!-- Pop In Circle Container -->
  <circle class="circle-bg" cx="60" cy="60" r="40" fill="#166534" />
  
  <!-- Smooth Checkmark Path -->
  <path class="check-mark" d="M 44 60 L 54 70 L 76 48" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

