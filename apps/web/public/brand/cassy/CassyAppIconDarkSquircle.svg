<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cassy App Icon Dark Squircle">
  <defs>
    <linearGradient id="cassyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="cassyStrokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A4DA2"/>
      <stop offset="50%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#C68B59"/>
    </linearGradient>
    <filter id="cassySubtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base (Radius 112px on 512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#cassyBgGrad)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Internal Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Geometric C and S Monogram with Drop Shadow -->
  <g filter="url(#cassySubtleShadow)" fill="none" stroke="url(#cassyStrokeGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- C Outer Arc -->
    <path d="M 358 152 C 330 116 284 96 236 96 C 148 96 98 166 98 256 C 98 346 148 416 236 416 C 284 416 330 396 358 360"/>
    <!-- Interlocking S Wave -->
    <path d="M 334 198 C 306 176 268 176 246 198 C 220 224 220 258 260 282 C 308 308 312 342 282 368 C 256 390 216 388 190 366"/>
  </g>

  <!-- Precision Anchor Dot (Crema Highlight) -->
  <circle cx="376" cy="256" r="20" fill="#C68B59"/>
  <!-- Subtly Endorsed Tech Accent Dot (AzureDevID) -->
  <circle cx="376" cy="256" r="8" fill="#00AEEF"/>
</svg>
